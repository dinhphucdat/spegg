name: Build and Test CUDA with GoogleTest

on:
  push:
    branches:
      - main
      - refactor_code
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcc libconfig++-dev

      # Conditional CUDA installation
      - name: Check if CUDA is already installed
        id: check-cuda
        run: |
          if command -v nvcc &> /dev/null; then
            echo "cuda_available=true" >> $GITHUB_OUTPUT
            echo "CUDA is already available:"
            nvcc --version
          else
            echo "cuda_available=false" >> $GITHUB_OUTPUT
            echo "CUDA not found, will install"
          fi

      - name: Install CUDA (if not available)
        if: steps.check-cuda.outputs.cuda_available == 'false'
        run: |
          echo "Installing CUDA..."
          # Enable multiverse repository (needed for CUDA on Ubuntu)
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository multiverse
          sudo apt-get update
          
          # Install CUDA toolkit from Ubuntu's official repository
          # This is the most reliable method for Ubuntu 24.04
          sudo apt-get install -y nvidia-cuda-toolkit
          
          # Set up environment variables
          echo 'export PATH=/usr/bin:$PATH' >> $GITHUB_ENV
          echo 'export CUDA_HOME=/usr' >> $GITHUB_ENV


      # Build the project
      - name: Build Project
        run: |
          mkdir -p build
          cd build
          cmake ..
          make

      # Run tests
      - name: Run GoogleTest
        run: |
          cd AssortativeTest
          mkdir -p build
          cd build
          cmake ..
          make
          ./AssortativeTest  # Replace with your actual test executable
